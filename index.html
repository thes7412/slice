<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>斬不盡的紙</title>
<meta name="description" content="滑動或點擊斬開白紙，碎片會依序癒合，越砍適應越快。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: one-screen dark stage, thin title bar on top, hint bar below, canvas takes the rest */
:root{
  --ink:#0a0a0a;
  --paper:#f2efe8;
  --line:#2a2826;
  --muted:#8e8a82;
  --blood:#d4403f;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;gap:12px}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.12em;margin:0;line-height:1.2}
h1 span{color:var(--blood)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--paper);font-weight:500;font-size:16px;margin-inline:2px}
.count b.st{color:var(--blood)}
.bar{height:2px;background:var(--line);border-radius:1px;overflow:hidden;margin-top:-6px}
.bar i{display:block;height:100%;width:0;background:var(--blood);transition:width .2s}
#cv{flex:1;min-height:0;width:100%;display:block;border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:crosshair}
.hint{font-size:13px;color:var(--muted);margin:0}
button{font:inherit;font-size:13px;color:var(--paper);background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
.btns{display:flex;gap:8px}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html{height:100%}body{margin:0}</style>
</head>
<body>
<header>
  <h1>斬不盡的<span>紙</span></h1>
  <div class="count">適應第<b id="st" class="st">0</b>階 · <b id="ad">0</b>刀 · 已復原<b id="cnt">0</b>次</div>
</header>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>
<canvas id="cv" aria-label="白色方紙，滑動或點擊可斬開，碎片會依斬擊順序逐刀癒合"></canvas>
<footer>
  <p class="hint">滑一刀斬開 · 點一下亂斬</p>
  <div class="btns"><button id="rst" type="button">重置適應</button><button id="snd" type="button" aria-pressed="true">音效 開</button></div>
</footer>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let GAP=10,SLIDE=10;const GROW=140,STAGES=8,PER=40;let spread=1,stage=-1,levelT=-1e9,levelSt=0;
function leaves(n){return n.kids?n.kids.flatMap(leaves):[n];}
function seamEdges(x,P,Q){const L=Math.hypot(Q[0]-P[0],Q[1]-P[1])||1,u=[(Q[0]-P[0])/L,(Q[1]-P[1])/L],out=[];for(let i=0;i<x.poly.length;i++){const a=x.poly[i],b=x.poly[(i+1)%x.poly.length];if(Math.abs(u[0]*(a[1]-P[1])-u[1]*(a[0]-P[0]))<0.6&&Math.abs(u[0]*(b[1]-P[1])-u[1]*(b[0]-P[0]))<0.6&&Math.hypot(b[0]-a[0],b[1]-a[1])>0.5)out.push([a,b]);}return out;}
let W=0,H=0,S=0,CX=0,CY=0,dpr=Math.max(1,window.devicePixelRatio||1);
let pieces=[],active=[],flashes=[],slashes=[],sparks=[],mergeT=-1e9,shake=0,count=0,sound=true,actx=null,drag=null,trail=[],lastHeal=0;
let DELAY,HGAP,DUR,adapt=0;
try{count=+localStorage.getItem('slice-count')||0;adapt=+localStorage.getItem('slice-adapt')||0;}catch(e){}
document.getElementById('cnt').textContent=count;
function applyAdapt(){const st=Math.min(STAGES,Math.floor(adapt/PER)),e=Math.pow(st/STAGES,2.5),L=(a,b)=>a+(b-a)*e;DELAY=L(1100,40);DUR=L(1200,70);HGAP=DUR+15;GAP=L(10,1.5);SLIDE=L(10,3);
document.getElementById('ad').textContent=adapt;document.getElementById('st').textContent=st;document.getElementById('bar').style.width=(st>=STAGES?100:(adapt%PER)/PER*100)+'%';
if(stage>=0&&st>stage){levelT=performance.now();levelSt=st;gong();}stage=st;try{localStorage.setItem('slice-adapt',adapt);}catch(e){}}

function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;S=Math.min(W,H)*0.5;CX=W/2;CY=H/2;whole();}
function square(){const h=S/2;return[[CX-h,CY-h],[CX+h,CY-h],[CX+h,CY+h],[CX-h,CY+h]];}
function area(p){let a=0;for(let i=0;i<p.length;i++){const j=(i+1)%p.length;a+=p[i][0]*p[j][1]-p[j][0]*p[i][1];}return Math.abs(a/2);}
function whole(){pieces=[{poly:square(),sl:[],ux:0,uy:0}];active=[];}
function ease(x){x=Math.min(1,Math.max(0,x));return 1-Math.pow(1-x,3);}

function split(poly,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=[],R=[],M=[];const s=p=>dx*(p[1]-a[1])-dy*(p[0]-a[0]);for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],sp=s(p),sq=s(q);if(sp>=0)L.push(p);if(sp<=0)R.push(p);if(sp===0)M.push(p);if(sp*sq<0){const t=sp/(sp-sq),m=[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];L.push(m);R.push(m);M.push(m);}}return[L,R,M];}

function ac(){actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
function swoosh(){if(!sound)return;try{const a=ac(),t=a.currentTime,dur=0.28,n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const src=a.createBufferSource();src.buffer=buf;const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(3200,t);bp.frequency.exponentialRampToValueAtTime(500,t+dur);const g=a.createGain();g.gain.value=0.5;src.connect(bp).connect(g).connect(a.destination);src.start();}catch(e){}}
function tick(){if(!sound)return;try{const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(1500,t);o.frequency.exponentialRampToValueAtTime(800,t+0.06);g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.1);}catch(e){}}
function gong(){if(!sound)return;try{const a=ac(),t=a.currentTime;[[98,0.22],[196,0.1],[294,0.05]].forEach(([f,v])=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.6);o.connect(g).connect(a.destination);o.start(t);o.stop(t+1.7);});}catch(e){}}
function chime(){if(!sound)return;try{const a=ac(),t=a.currentTime;[523,784,1046].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),s=t+i*0.05;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.08,s+0.02);g.gain.exponentialRampToValueAtTime(0.001,s+0.6);o.connect(g).connect(a.destination);o.start(s);o.stop(s+0.7);});}catch(e){}}

function cut(a,b){const now=performance.now();let dx=b[0]-a[0],dy=b[1]-a[1];const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;const E=4000,A=[a[0]-dx*E,a[1]-dy*E],B=[a[0]+dx*E,a[1]+dy*E];
const sl={P:null,Q:null,n:[-dy,dx],t:[dx,dy],born:now,healStart:0,dur:DUR,cg:0,ct:0,pairs:[],started:false,done:false},out=[];
const mx=a[0]+dx*((CX-a[0])*dx+(CY-a[1])*dy),my=a[1]+dy*((CX-a[0])*dx+(CY-a[1])*dy);let ref=null,bd=1e18;for(const pc of pieces){let x=0,y=0;for(const q of pc.poly){x+=q[0];y+=q[1];}x=x/pc.poly.length+pc.ux;y=y/pc.poly.length+pc.uy;const d=(x-mx)**2+(y-my)**2;if(d<bd){bd=d;ref=pc;}}const RX=ref?ref.ux:0,RY=ref?ref.uy:0,P=[A[0]-RX,A[1]-RY],Q=[B[0]-RX,B[1]-RY];
sl.P=P;sl.Q=Q;const whole1=[];const sideOf=(pc,P,Q)=>{let x=0,y=0;for(const q of pc.poly){x+=q[0];y+=q[1];}x/=pc.poly.length;y/=pc.poly.length;return (Q[0]-P[0])*(y-P[1])-(Q[1]-P[1])*(x-P[0])>=0?1:-1;};
for(const pc of pieces){if(pieces.length>240||area(pc.poly)<25){out.push(pc);whole1.push([pc,sideOf(pc,P,Q)]);continue;}const[L,R,M]=split(pc.poly,P,Q);if(L.length<3||R.length<3||area(L)<3||area(R)<3){out.push(pc);whole1.push([pc,sideOf(pc,P,Q)]);continue;}
const kl={poly:L,sl:pc.sl.concat([[sl,1]]),ux:pc.ux,uy:pc.uy},kr={poly:R,sl:pc.sl.concat([[sl,-1]]),ux:pc.ux,uy:pc.uy};out.push(kl,kr);pc.kids=[kl,kr];sl.pairs.push(kl);}
slashes.push({a:A,b:B,t:now});if(!sl.pairs.length)return;
for(const[pc,sd]of whole1)pc.sl=pc.sl.concat([[sl,sd]]);pieces=out;sl.healStart=now+DELAY;active.push(sl);adapt++;applyAdapt();
if(!RM)shake=Math.min(10,shake+5);const nx=-dy,ny=dx,t0=(CX-a[0])*dx+(CY-a[1])*dy;for(let i=0;i<24;i++){const k=t0+(Math.random()-0.5)*S*1.3,v=1+Math.random()*3,s=Math.random()<0.5?1:-1;sparks.push({x:a[0]+dx*k,y:a[1]+dy*k,vx:dx*(2+Math.random()*4)+nx*v*s*0.5,vy:dy*(2+Math.random()*4)+ny*v*s*0.5,l:1,r:Math.random()<0.3});}swoosh();}
function randomCuts(){const n=3+Math.floor(Math.random()*3);for(let i=0;i<n;i++)setTimeout(()=>{const g=Math.random()*Math.PI*2,px=CX+(Math.random()-0.5)*S*0.6,py=CY+(Math.random()-0.5)*S*0.6;cut([px,py],[px+Math.cos(g),py+Math.sin(g)]);},i*85);}

function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId);}catch(_){}drag={s:pos(e)};trail=[{p:pos(e),t:performance.now()}];});
cv.addEventListener('pointermove',e=>{if(drag)trail.push({p:pos(e),t:performance.now()});});
cv.addEventListener('pointerup',e=>{if(!drag)return;const p=pos(e);if(Math.hypot(p[0]-drag.s[0],p[1]-drag.s[1])<12)randomCuts();else cut(drag.s,p);drag=null;});
cv.addEventListener('pointercancel',()=>{drag=null;trail=[];});
document.getElementById('rst').onclick=()=>{adapt=0;applyAdapt();};
const sb=document.getElementById('snd');
sb.onclick=()=>{sound=!sound;sb.textContent='音效 '+(sound?'開':'關');sb.setAttribute('aria-pressed',sound);};

function step(){const now=performance.now();
for(const sl of active){const g=ease((now-sl.born)/GROW);if(now<sl.healStart){sl.cg=g;sl.ct=g;continue;}
const p=(now-sl.healStart)/sl.dur;sl.ct=g*(1-ease(p*2));sl.cg=g*(1-ease(p*2-1));if(p>=1){sl.done=true;sl.cg=0;sl.ct=0;tick();for(const A of sl.pairs)for(const x of leaves(A))for(const e of seamEdges(x,sl.P,sl.Q))flashes.push({x,e,t:now});}}
active=active.filter(s=>!s.done);
const tgt=active.length<=4?1:4/active.length;spread+=(tgt-spread)*0.15;const gEff=GAP*spread,tEff=SLIDE*spread;
for(const pc of pieces){let ux=0,uy=0;for(const[sl,side]of pc.sl){if(sl.done)continue;ux+=side*gEff*sl.cg*sl.n[0];uy+=side*gEff*sl.cg*sl.n[1];if(side>0){ux+=tEff*sl.ct*sl.t[0];uy+=tEff*sl.ct*sl.t[1];}}pc.ux=ux;pc.uy=uy;}
if(pieces.length>1&&!active.length){whole();mergeT=now;count++;document.getElementById('cnt').textContent=count;try{localStorage.setItem('slice-count',count);}catch(e){}chime();}
for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vx*=0.93;s.vy*=0.93;s.l-=0.03;}sparks=sparks.filter(s=>s.l>0);shake*=0.82;}

function draw(){const now=performance.now();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
const lk=(now-levelT)/1500;if(lk<1){const al=lk<0.15?lk/0.15:1-(lk-0.15)/0.85;ctx.strokeStyle=`rgba(212,64,63,${al*0.8})`;ctx.lineWidth=2;const h=S/2+8+ease(lk)*S*0.25;ctx.strokeRect(CX-h,CY-h,h*2,h*2);ctx.fillStyle=`rgba(212,64,63,${al})`;ctx.font='900 22px "Noto Serif TC",serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(levelSt>=STAGES?'完全適應':'適應・第'+levelSt+'階',CX,CY-S/2-14);}
const rk=(now-mergeT)/600;if(rk<1){ctx.strokeStyle=`rgba(242,239,232,${(1-rk)*0.5})`;ctx.lineWidth=1.5;const h=S/2+rk*S*0.35;ctx.strokeRect(CX-h,CY-h,h*2,h*2);}
ctx.lineJoin='miter';ctx.fillStyle='#f2efe8';ctx.strokeStyle='#f2efe8';ctx.lineWidth=0.6;
for(const pc of pieces){ctx.beginPath();pc.poly.forEach((q,i)=>{const x=q[0]+pc.ux,y=q[1]+pc.uy;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.fill();ctx.stroke();}
ctx.lineCap='round';for(const f of flashes){const k=(now-f.t)/450;if(k>1)continue;const r=f.x,a=f.e[0],b=f.e[1];ctx.strokeStyle=`rgba(212,64,63,${(1-k)*0.9})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(a[0]+r.ux,a[1]+r.uy);ctx.lineTo(b[0]+r.ux,b[1]+r.uy);ctx.stroke();}
flashes=flashes.filter(f=>now-f.t<450);
for(const s of slashes){const k=(now-s.t)/260;if(k>1)continue;ctx.strokeStyle=`rgba(212,64,63,${(1-k)*0.5})`;ctx.lineWidth=7*(1-k)+1.5;ctx.beginPath();ctx.moveTo(s.a[0],s.a[1]);ctx.lineTo(s.b[0],s.b[1]);ctx.stroke();ctx.strokeStyle=`rgba(255,255,255,${1-k})`;ctx.lineWidth=2.4*(1-k)+0.6;ctx.stroke();}
slashes=slashes.filter(s=>now-s.t<260);
for(const s of sparks){ctx.fillStyle=s.r?`rgba(240,149,149,${s.l})`:`rgba(255,255,255,${s.l})`;ctx.fillRect(s.x-1.1,s.y-1.1,2.2,2.2);}
if(drag&&trail.length>1){const t=trail.filter(q=>now-q.t<180);for(let i=1;i<t.length;i++){const k=i/t.length;ctx.strokeStyle=`rgba(255,255,255,${k*0.8})`;ctx.lineWidth=k*3;ctx.beginPath();ctx.moveTo(t[i-1].p[0],t[i-1].p[1]);ctx.lineTo(t[i].p[0],t[i].p[1]);ctx.stroke();}}}
function loop(){step();draw();requestAnimationFrame(loop);}
applyAdapt();
window.addEventListener('resize',resize);resize();loop();
</script>

</body>
</html>
