<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>魔虛紙</title>
<meta name="description" content="用宿儺與五條悟的招式攻擊白紙，碎片會依序癒合，法陣每轉一格就對該類攻擊適應並瞬間全癒。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: one-screen dark stage; title, adaptation wheels, canvas, character tabs, technique grid, hint bar */
:root{
  --ink:#0a0a0a;
  --paper:#f2efe8;
  --line:#2a2826;
  --muted:#8e8a82;
  --blood:#d4403f;
  --fire:#ff8c28;
  --ao:#60a5fa;
  --aka:#eb5050;
  --mura:#9d7bff;
  --lim:#60a5fa;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;gap:8px}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.12em;margin:0;line-height:1.2}
h1 span{color:var(--blood)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--paper);font-weight:500;font-size:16px;margin-inline:2px}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.chip{position:relative;border:1px solid var(--line);border-radius:4px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;line-height:1.3;color:var(--muted);min-width:0;overflow:hidden}
.chip .nm{font-family:var(--display);font-weight:700;color:var(--paper);font-size:13px;white-space:nowrap}
.chip .lv{white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .lv b{font-weight:500}
.chip i{position:absolute;left:0;bottom:0;height:2px;width:0;transition:width .2s}
#c-slash b{color:var(--blood)}#c-slash i{background:var(--blood)}
#c-fire b{color:var(--fire)}#c-fire i{background:var(--fire)}
#c-ao b{color:var(--ao)}#c-ao i{background:var(--ao)}
#c-aka b{color:var(--aka)}#c-aka i{background:var(--aka)}
#c-mura b{color:var(--mura)}#c-mura i{background:var(--mura)}
#c-uv b{color:#aacdff}#c-uv i{background:#aacdff}
#c-uv .nm{font-size:11px}
.chip.max i{background:var(--paper)!important}
#cv{flex:1;min-height:0;width:100%;display:block;border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:crosshair}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tabs button{border:0;border-radius:0;font-family:var(--display);font-weight:700;font-size:14px;padding:6px 0;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--paper);background:#1c1a19}
.tabs button[data-c="sukuna"][aria-selected="true"]{box-shadow:inset 0 -2px 0 var(--blood)}
.tabs button[data-c="gojo"][aria-selected="true"]{box-shadow:inset 0 -2px 0 var(--lim)}
.techs{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px}
.techs button{font-family:var(--display);font-weight:700;font-size:14px;padding:7px 2px;white-space:nowrap}
.techs button[aria-checked="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.techs button[data-lock="1"]{opacity:.38}
@media (hover:hover) and (pointer:fine){.techs button{position:relative}.techs button[data-key]::after{content:attr(data-key);position:absolute;top:2px;right:4px;font-family:ui-monospace,monospace;font-size:9px;font-weight:600;opacity:.5}.tabs button[aria-selected="false"]::after{content:' (Tab)';font-size:10px;opacity:.4}}
.techs button[data-lock="0"][data-t="fire"]{border-color:var(--fire);box-shadow:0 0 0 1px var(--fire)}
.ver{font-family:ui-monospace,monospace;font-size:11px;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.hint{font-size:12px;color:var(--muted);margin:0;flex:1;min-width:0}
.btns{display:flex;gap:8px}
button{font:inherit;font-size:13px;color:var(--paper);background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html{height:100%}body{margin:0}</style>
</head>
<body>
<header>
  <h1>魔虛<span>紙</span><small class="ver">v1.0</small></h1>
  <div class="count">已復原<b id="cnt">0</b>次・已消滅<b id="kills">0</b>次</div>
</header>
<div class="chips" aria-label="法陣適應進度">
  <div class="chip" id="c-slash"><span class="nm">斬擊</span><span class="lv"><b>0</b>/8</span><i></i></div>
  <div class="chip" id="c-fire"><span class="nm">火焰</span><span class="lv"><b>0</b>/8</span><i></i></div>
  <div class="chip" id="c-ao"><span class="nm">蒼</span><span class="lv"><b>0</b>/8</span><i></i></div>
  <div class="chip" id="c-aka"><span class="nm">赫</span><span class="lv"><b>0</b>/8</span><i></i></div>
  <div class="chip" id="c-mura"><span class="nm">茈</span><span class="lv"><b>0</b>/8</span><i></i></div>
  <div class="chip" id="c-uv"><span class="nm">無量空處</span><span class="lv"><b>0</b>/8</span><i></i></div>
</div>
<canvas id="cv" aria-label="白色方紙，可用宿儺與五條悟的招式攻擊，傷口會癒合並依攻擊性質逐步適應"></canvas>
<div class="tabs" role="tablist" aria-label="角色">
  <button type="button" role="tab" data-c="sukuna" aria-selected="true">宿儺</button>
  <button type="button" role="tab" data-c="gojo" aria-selected="false">五條悟</button>
</div>
<div class="techs" id="techs" role="radiogroup" aria-label="招式"></div>
<footer>
  <p class="hint" id="hint"></p>
  <div class="btns"><button id="rst" type="button">重置適應</button><button id="snd" type="button" aria-pressed="true">音效 開</button></div>
</footer>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),layer=document.createElement('canvas'),lx=layer.getContext('2d');
const RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const CAP=1600,VANISH=16,GROW=140,STAGES=8,CHANT_MS=170,CHANT_DELAY=250,CHANTS={mura:'九綱 偏光 烏と声明 表裏の間',world:'龍鱗 反発 番いの流星',ao:'位相 黄昏 智慧の瞳',aka:'位相 波羅蜜 光の柱'};
const POOL={kai:'slash',hachi:'slash',kumo:'slash',dom:'slash',fire:'fire',burn:'fire',ao:'ao',aka:'aka',mura:'mura',world:null};
const PER={slash:40,fire:6,ao:10,aka:10,mura:10,uv:3},PNAME={slash:'斬擊',fire:'火焰',ao:'蒼',aka:'赫',mura:'茈',uv:'無量空處'},PCOL={slash:'212,64,63',fire:'255,140,40',ao:'96,165,250',aka:'235,80,80',mura:'157,123,255',uv:'170,205,255'};
const CHARS={sukuna:[['kai','解'],['hachi','捌'],['kumo','蜘蛛之絲'],['fire','竈・開'],['dom','伏魔御廚子']],gojo:[['ao','蒼'],['aka','赫'],['mura','茈'],['uv','無量空處']]};
const HINTS={kai:'滑動斬開 · 點一下亂斬 · 按住不動詠唱世界斬',hachi:'點一塊紙切成細塊 · 按住不動詠唱世界斬',kumo:'點一下：以該點為中心向四周放射斬開',fire:'按住往後拉弓，放開射出火箭，落點大爆炸 · 伏魔御廚子中變成竈，點燃圈內粉塵',world:'滑動：連同空間一起切開，無法被適應',dom:'點一下：全畫面展開 · 用手指畫一圈決定範圍，圈越小斬得越密 · 展開期間可用竈・開',ao:'按住拖曳：撕紙捲走並吸近周圍，放開壓爆 · 按住不動詠唱出力最大（存在時切到赫點它可融合成茈）',aka:'點一下：紅光球凝聚後爆炸 · 按住不動詠唱，唸完放開原地超大爆炸',mura:'滑動抹消一條帶 · 按住不動詠唱，唸完放開釋放 200% · 蒼赫融合倒數中按住可完全詠唱',uv:'點一下：無量空處，期間法陣停轉、傷口停止癒合；被適應後效果變弱'};
const FLASH={kai:'212,64,63',hachi:'212,64,63',kumo:'212,64,63',dom:'212,64,63',fire:'255,140,40',burn:'255,140,40',ao:'96,165,250',aka:'230,70,70',mura:'157,123,255',world:'255,255,255'};
let W=0,H=0,S=0,CX=0,CY=0,dpr=Math.max(1,window.devicePixelRatio||1);
let fArrows=[],muraQ=[],fusion=null,akaQ=[],booms=[],pieces=[],active=[],flashes=[],slashes=[],voids=[],rings=[],sparks=[],stars=[],mergeT=-1e9,shake=0,count=0,sound=true,actx=null,g=null,trail=[],spread=1,domain=null,uv=null,lastTick=0,lastStep=0,worldFlash=-1e9,chant=null;
let dirty=false,chr='sukuna',tech='kai',adapt={slash:0,fire:0,ao:0,aka:0,mura:0,uv:0},stage={},levelT=-1e9,levelTxt='',levelCol='212,64,63',wheel={slash:{t:-1e9},fire:{t:-1e9},ao:{t:-1e9},aka:{t:-1e9},mura:{t:-1e9},uv:{t:-1e9}};
try{count=+localStorage.getItem('slice-count')||0;const a=JSON.parse(localStorage.getItem('slice-adapt5')||'null');if(a)Object.assign(adapt,a);else{const o=JSON.parse(localStorage.getItem('slice-adapt4')||'null');if(o){adapt.slash=o.slash||0;adapt.fire=o.fire||0;}}}catch(e){}
document.getElementById('cnt').textContent=count;let kills=0;try{kills=+localStorage.getItem('slice-kills')||0;}catch(e){}document.getElementById('kills').textContent=kills;

function stageOf(p){return p?Math.min(STAGES,Math.floor(adapt[p]/PER[p])):0;}
function params(t){const e=Math.pow(stageOf(POOL[t])/STAGES,2.5),L=(a,b)=>a+(b-a)*e;return{delay:L(1100,40),dur:L(1200,70),gap:L(10,1.5),slide:L(10,3),shr:L(0.16,0.04),band:L(52,16),cell:L(30,70),push:L(40,8),craterR:L(50,14),aoCap:L(46,14),aoPull:L(130,40),aoBig:L(0.38,0.18)};}
function say(txt,col){levelT=performance.now();levelTxt=txt;levelCol=col||'212,64,63';}
function renderAdapt(){for(const t in adapt){const st=stageOf(t),el=document.getElementById('c-'+t);el.querySelector('b').textContent=st;el.querySelector('i').style.width=(st>=STAGES?100:(adapt[t]%PER[t])/PER[t]*100)+'%';el.classList.toggle('max',st>=STAGES);
if(stage[t]!==undefined&&st>stage[t])turnWheel(t,st);stage[t]=st;}
try{localStorage.setItem('slice-adapt5',JSON.stringify(adapt));}catch(e){}}
const mw={from:0,to:0,t:-1e9,col:'230,195,110',ox:0,oy:0,vx:0,vy:0,aj:0,av:0,res:null,cool:0,bad:0};
function mwAng(now){const k=(now-mw.t)/650;return k>=1?mw.to:mw.from+(mw.to-mw.from)*(k<0.18?-0.12*Math.sin(k/0.18*Math.PI):backOut((k-0.18)/0.82));}
function mwTurn(t){const now=performance.now();mw.from=mwAng(now);mw.to+=Math.PI/4;mw.t=now;mw.col=PCOL[t];}
function mwHit(px,py,str){let dx=CX-px,dy=CY-py,d=Math.hypot(dx,dy);if(d<4){const a=Math.random()*Math.PI*2;dx=Math.cos(a);dy=Math.sin(a);d=1;}const f=str/(1+d/(S*0.6));mw.vx+=dx/d*f;mw.vy+=dy/d*f;mw.av+=(Math.random()-0.5)*str*0.006;}
function mwLineHit(a,dx,dy,str){const t=(CX-a[0])*dx+(CY-a[1])*dy;mwHit(a[0]+dx*t,a[1]+dy*t,str);}
function inHoleAt(h,pt,ox,oy,strict){const x=h.hx+ox,y=h.hy+oy,d=Math.hypot(pt[0]-x,pt[1]-y);if(h.k==='z'){if(strict&&h.a<0.5)return false;return d<h.r*zoneF(h.z,Math.atan2(pt[1]-y,pt[0]-x))-1;}if(h.k==='b')return d<h.r*0.88;return d<h.r*0.9;}
function coveredAt(pt,now){const H=holeList(now);for(const pc of pieces){if(hidden(pc)||pc.sc<0.05)continue;let inside=false;for(const poly of visibleParts(pc))if(inPoly(pt,poly.map(q=>xf(pc,q)))){inside=true;break;}if(!inside)continue;const cr=craters(pc,now);let gone=false;for(const[c,r]of cr)if(Math.hypot(pt[0]-c.x,pt[1]-c.y)<r*0.85){gone=true;break;}
if(!gone)for(const h of H)if(inHoleAt(h,pt,pc.ux,pc.uy,true)){gone=true;break;}if(!gone)return true;}return false;}
function mwBroken(now){const hr=S*0.05;let miss=0;const pts=[[CX,CY]];for(let i=0;i<8;i++)pts.push([CX+Math.cos(i*Math.PI/4)*hr,CY+Math.sin(i*Math.PI/4)*hr]);for(const p of pts)if(!coveredAt(p,now))miss++;return miss/pts.length>=0.6;}
function coverRatio(now,n){n=n||12;const h=S/2;let c=0,t=0;for(let i=0;i<n;i++)for(let j=0;j<n;j++){t++;if(coveredAt([CX-h+(i+0.5)/n*S,CY-h+(j+0.5)/n*S],now))c++;}return c/t;}
function wipedOut(now){const h=S/2-1.5,n=16;for(let i=0;i<=n;i++)for(let j=0;j<=n;j++)if(coveredAt([CX-h+i/n*2*h,CY-h+j/n*2*h],now))return false;
for(const sl of active)if(sl.debris)for(const db of sl.debris)if(db.d<holeR(sl,sl.circles[0],now)-1)return false;return true;}
const SUMMON='布瑠部由良由良';
function mwKill(now,sl){mw.dead={t0:now,ang:mwAng(now)+mw.aj,x:CX+mw.ox,y:CY+mw.oy,by:sl.tech};mw.res=null;pieces=[];active=[];dirty=false;domain=null;voids=[];kills++;document.getElementById('kills').textContent=kills;try{localStorage.setItem('slice-kills',kills);}catch(e){}
say('魔虛羅・消滅','230,195,110');tone('sine',90,30,1.6,0.4);noiseBurst(1.2,600,80,0.7,0.5);setTimeout(()=>{tone('sine',60,25,1.2,0.3);noiseBurst(0.6,300,60,0.5,0.4);},700);if(!RM)shake=Math.max(shake,18);
for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*4;sparks.push({x:mw.dead.x,y:mw.dead.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:'235,200,120'});}}
function summonBtn(){return{x:CX-74,y:CY-22,w:148,h:44};}
function startSummon(now){if(!mw.dead||mw.summon)return;mw.summon={t0:now};for(const k in adapt)adapt[k]=0;stage={};renderAdapt();for(const k in stage)stage[k]=0;}
function summonTick(now){const M=mw.summon;if(!M)return;const tC=SUMMON.length*230+250;if(!M.chimed&&now>=M.t0+tC){M.chimed=true;tone('sine',220,440,0.8,0.2);tone('sine',330,660,0.8,0.08);noiseBurst(0.8,300,2400,0.25,1);}
if(now>=M.t0+tC+1300){mw.summon=null;mw.dead=null;mw.ox=mw.oy=mw.vx=mw.vy=mw.aj=mw.av=0;mw.from=mw.to=0;mw.t=-1e9;whole();mergeT=now;dirty=false;mw.cool=now+600;}}
function mwStart(now,st){mw.res={t0:now,dur:2600-Math.max(0,Math.min(7,(st||1)-1))/7*1900,rk:0};say('魔虛羅・再生','230,195,110');tone('sine',110,220,1.0,0.25);tone('sine',220,440,0.9,0.08);noiseBurst(0.8,300,2400,0.2,1);}
function mwTick(now,dt){const fk=dt/16.7||1;mw.vx+=-mw.ox*0.12*fk;mw.vy+=-mw.oy*0.12*fk;const dmp=Math.pow(0.82,fk);mw.vx*=dmp;mw.vy*=dmp;mw.ox+=mw.vx*fk;mw.oy+=mw.vy*fk;const lim=S*0.18,L=Math.hypot(mw.ox,mw.oy);if(L>lim){mw.ox*=lim/L;mw.oy*=lim/L;}
mw.av+=-mw.aj*0.1*fk;mw.av*=dmp;mw.aj+=mw.av*fk;
if(mw.dead){summonTick(now);return;}
const R=mw.res;if(R){if(!R.ab&&active.some(s2=>s2.born>R.t0+250)){R.ab=now;R.rk0=R.rk;}if(R.ab){R.rk=R.rk0*Math.max(0,1-(now-R.ab)/200);if(now-R.ab>=200){mw.res=null;mw.cool=now+400;}return;}
const k=(now-R.t0)/R.dur;R.rk=ease(Math.min(1,k/0.75));if(k>=1){mw.res=null;mw.cool=now+600;dirty=false;whole();mergeT=now;count++;document.getElementById('cnt').textContent=count;try{localStorage.setItem('slice-count',count);}catch(e){}chime();}return;}
if(dirty&&now-(mw.wchk||0)>110){mw.wchk=now;const h=S/2-2;let any=false;for(let i=0;i<5&&!any;i++)for(let j=0;j<5;j++)if(coveredAt([CX-h+i/4*2*h,CY-h+j/4*2*h],now)){any=true;break;}if(!any&&wipedOut(now)){mwKill(now,active[active.length-1]||{tech:null});return;}}
if(!dirty||now<mw.cool||g||fusion||muraQ.length||akaQ.length||fArrows.length||(uv&&now<uv.end)||(domain&&now<domain.end+700)){mw.bad=0;return;}
}
function turnWheel(t,st){const now=performance.now();mwTurn(t);if(!mw.dead&&!mw.res&&!(uv&&now<uv.end&&uvFreeze()>0.5)&&mwBroken(now))mwStart(now,st);wheel[t].t=now;say(st>=STAGES?'完全適應「'+PNAME[t]+'」':'法陣轉動「'+PNAME[t]+'」・'+st+'/8',PCOL[t]);
for(const sl of active){if(POOL[sl.tech]!==t||sl.done)continue;if(sl.stamps){for(const x of sl.stamps)if(now<x.hs+x.dur){x.hs=now;x.dur=170;}if(sl.phase==='burst'||sl.phase==='fused')sl.healStart=Math.min(sl.healStart,now+170);}sl.healStart=Math.min(sl.healStart,now);if(now<sl.healStart+sl.dur){sl.healStart=now;sl.dur=170;}}thunk();gong();}

function resize(){const r=cv.getBoundingClientRect();if(Math.abs(r.width-W)<1&&Math.abs(r.height-H)<1)return;W=r.width;H=r.height;cv.width=layer.width=W*dpr;cv.height=layer.height=H*dpr;S=Math.min(W,H)*0.5;CX=W/2;CY=H/2;
stars=[];for(let i=0;i<140;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.2,s:Math.random()*0.6+0.2});if(pieces.length<=1&&!active.length&&!mw.dead)whole();}
function square(){const h=S/2;return[[CX-h,CY-h],[CX+h,CY-h],[CX+h,CY+h],[CX-h,CY+h]];}
function area(p){let a=0;for(let i=0;i<p.length;i++){const j=(i+1)%p.length;a+=p[i][0]*p[j][1]-p[j][0]*p[i][1];}return Math.abs(a/2);}
function cen(p){let x=0,y=0;for(const q of p){x+=q[0];y+=q[1];}return[x/p.length,y/p.length];}
function mkPiece(poly,sl,ux,uy){return{poly,sl,ux,uy,sc:1,kids:null};}
function whole(){pieces=[mkPiece(square(),[],0,0)];active=[];}
function ease(x){x=Math.min(1,Math.max(0,x));return 1-Math.pow(1-x,3);}
function leaves(n){return n.kids?n.kids.flatMap(leaves):[n];}
let pendRoots=new Set();
function subConvex(A,B){const out=[];let cur=A;const c=cen(B);for(let i=0;i<B.length&&cur&&cur.length>=3;i++){const a=B[i],b=B[(i+1)%B.length];if(Math.hypot(b[0]-a[0],b[1]-a[1])<1e-6)continue;const[L,R]=split(cur,a,b),sc=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]),inn=sc>=0?L:R,outp=sc>=0?R:L;if(outp.length>=3&&area(outp)>=3)out.push(outp);cur=inn.length>=3&&area(inn)>=0.5?inn:null;}return out;}
